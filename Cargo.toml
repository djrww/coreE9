[package]
name = "cl0r0"
version = "0.1.1"
edition = "2021"
description = "CL0/R0 dual carrier: surface syntax trees, nine laws (L1-L9), mechanical self-verification"
license = "MIT"

[lib]
name = "cl0r0"
path = "src/lib.rs"

[[bin]]
name = "cl0r0"
path = "src/bin/cl0r0.rs"

[[bin]]
name = "l9newman"
path = "src/bin/l9newman.rs"

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"

# P4-0 Tier-A oracle 跑者(PIVOT-RUSTC-ORACLE §四):只與 oracle feature
# 同生共死 —— 默認構建零感知,core 發佈面不變。
[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
required-features = ["oracle"]

[features]
# oracle:以 rustc 為行為權威的判決通道(Tier-A,stable 即可,零新依賴)。
# 默認關閉;啟用:`cargo test --features oracle`(CI 的 oracle job)。
oracle = []


[profile.release]
debug = true
# PGO + LTO 優化(LTO 固化在 profile;PGO 由 RUSTFLAGS 驅動兩輪構建)
lto = "fat"
codegen-units = 1
opt-level = 3

[dev-dependencies]
pest = "2.9.1"
pest_derive = "2.9.1"

