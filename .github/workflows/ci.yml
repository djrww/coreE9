name: CI

on:
  # ★ N3(2026-09-03):原先只有 [main] ⇒ 直接 push 到 `p4` 等主題分支
  # **完全不觸發 CI**。實測 GitHub API:受檢 HEAD `483a142` 上查無任何
  # workflow run / check-run(total_count: 0)—— 也就是說「CI 全綠」的宣稱
  # 從未在該 commit 上被驗證過。改用 glob 覆蓋 `p*` 主題分支。
  push:
    branches: [main, "p*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt → clippy → test → doc(九律矩陣即驗收合同)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: test(九律具名矩陣:L1–L9 / M1 M2 M4 M5 / T2 / R₀ / 語義面 / 反例縮小)
        run: cargo test --all

      - name: rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  # ── N4-a:定理庫在兩個 Coq/Rocq 版本上都必須編譯(§P3-14 #4)──────────
  # 為什麼拆成兩個 job:版本矩陣要的是「敘述在兩個版本都成立」,而對帳
  # (reconcile)需要 cargo —— 容器內沒有,硬塞進去只會讓矩陣兩格都變慢。
  # 故:定理庫走容器矩陣,對帳留在單一版本(Rust ↔ Rocq 的語義一致性與
  # coq 版本無關,它是兩個獨立實作的對比)。
  rocq:
    name: rocq theorems · coq ${{ matrix.coq_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一格紅不要停掉另一格:要看見「哪個版本斷」
      matrix:
        # 本機(沙箱 apt)實測:8.20.1 + OCaml 5.3.0 全綠。
        # 9.2 為官方 Rocq 改名後的版本(Stdlib 更名,`Coq` 仍為別名)。
        coq_version: ["8.20", "9.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}
          ocaml_version: "4.14-flambda"
          before_script: |
            startGroup "toolchain versions"
              coqc --version
              ocamlc -version
              coqc --version > rocq-version.txt
            endGroup
          script: |
            startGroup "build theorem library"
              make -C rocq
            endGroup

      # artifact 存版本行:日後要複現任何一次綠,先知道它是哪個版本綠的
      - name: Upload version line
        uses: actions/upload-artifact@v4
        with:
          name: rocq-version-${{ matrix.coq_version }}
          path: rocq-version.txt
          if-no-files-found: warn

  rocq-reconcile:
    name: rocq reconcile(Rust 實例 ↔ Rocq 鏡像,kernel 複驗)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意:**不裝 MathComp** —— 本形式化只用 Coq 標準庫
      # (`From Coq Require Import List Arith Bool Lia Classical Wellfounded`),
      # 全庫 grep 不到任何 mathcomp / ssreflect 載入,實測卸載後仍全綠。
      # 少一個相依就少一個跨版本更名的破口(#4 關心的正是這個)。
      - name: Install Rocq(Coq)
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reconcile(Rust 實例 ↔ Rocq 鏡像)
        run: make -C rocq reconcile

  coverage:
    name: coverage gate(core ≥ 90%,ast ≥ 75% 豁免)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + llvm tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Collect coverage
        run: cargo llvm-cov --lcov --output-path target/coverage.lcov

      # 先自測 gate 判別力:空報告 / 模組缺席 / 同名 basename 都必須紅
      # (舊版對這些一律 exit 0 —— 門檻只在文件裡存在)
      - name: Coverage gate self-test(fail-open guards)
        run: python3 tools/cov_gate_selftest.py

      - name: Coverage gate
        run: python3 tools/cov_gate.py target/coverage.lcov

  bench:
    name: benchmark gate(hotpaths best-of-n ±25% −5% 雜訊下限 + null 漂移校正)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run hotpaths benchmark
        run: |
          set -o pipefail
          mkdir -p target
          cargo bench --bench hotpaths -- --reps 11 --newman-reps 5 2>&1 | tee target/bench.log

      # 先自測 gate 本身的判別力(防止「修到永遠綠」),再判真實代碼
      - name: Gate self-test(discriminative power)
        run: python3 tools/bench_gate_selftest.py

      - name: Benchmark gate
        run: python3 tools/bench_gate.py target/bench.log bench/BASELINE.json --tol 0.25

      # 失敗時可直接看原始統計(null 漂移、MAD),不必重跑
      - name: Upload raw bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotpaths-bench-log
          path: target/bench.log
          if-no-files-found: ignore

  docs-consistency:
    name: docs consistency(STATUS.json = 數字單一來源)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + llvm tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Rocq(Coq)+ MathComp
        run: |
          sudo apt-get update
          sudo apt-get install -y coq libcoq-mathcomp-ssreflect

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      # 先自測稽核器判別力:文件數字寫錯 / 規則命中 0 次 都必須紅
      # (命中 0 次視為失敗 —— 文件被重整而規則靜默失效,是這類漂移的溫床)
      - name: Docs check self-test(discriminative power)
        run: python3 tools/docs_check_selftest.py

      # 由實測重新產生 STATUS.json(不信任庫裡那份:它只是給人看的快照)
      - name: Generate STATUS.json
        run: python3 tools/gen_status.py

      - name: Docs consistency check
        run: python3 tools/docs_check.py

      - name: Upload STATUS.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STATUS-json
          path: docs/STATUS.json
          if-no-files-found: ignore
