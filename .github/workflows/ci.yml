name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt → clippy → test → doc(九律矩陣即驗收合同)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: test(九律具名矩陣:L1–L9 / M1 M2 M4 M5 / T2 / R₀ / 語義面 / 反例縮小)
        run: cargo test --all

      - name: rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  rocq:
    name: rocq gate(Phase 0/1:mirror + Newman + 對帳)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rocq(Coq)+ MathComp
        run: |
          sudo apt-get update
          sudo apt-get install -y coq libcoq-mathcomp-ssreflect

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build theorem library
        run: make -C rocq

      - name: Reconcile(Rust 實例 ↔ Rocq 鏡像)
        run: make -C rocq reconcile

  coverage:
    name: coverage gate(core ≥ 90%,ast ≥ 75% 豁免)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + llvm tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Collect coverage
        run: cargo llvm-cov --lcov --output-path target/coverage.lcov

      - name: Coverage gate
        run: python3 tools/cov_gate.py target/coverage.lcov

  bench:
    name: benchmark gate(hotpaths ±25%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run hotpaths benchmark
        run: |
          set -o pipefail
          mkdir -p target
          cargo bench --bench hotpaths 2>&1 | tee target/bench.log

      - name: Benchmark gate
        run: python3 tools/bench_gate.py target/bench.log bench/BASELINE.json --tol 0.25
