name: CI

on:
  push:
    # P4-3+:工作分支 m1 / m1.1 同受九律矩陣約束(PAT 一次推送即驗);
    # main 保持合流終點。
    branches: [main, m1, m1.1]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt → clippy → test → doc(九律矩陣即驗收合同)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: test(九律具名矩陣:L1–L9 / M1 M2 M4 M5 / T2 / R₀ / 語義面 / 反例縮小)
        run: cargo test --all

      - name: rustdoc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  rocq:
    name: rocq gate(⏸ 凍結 2026-09-06:資產保留,判決不變;見 docs/PIVOT-RUSTC-ORACLE.md §七)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rocq(Coq)+ MathComp
        run: |
          sudo apt-get update
          sudo apt-get install -y coq libcoq-mathcomp-ssreflect

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build theorem library
        run: make -C rocq

      - name: Reconcile(Rust 實例 ↔ Rocq 鏡像)
        run: make -C rocq reconcile

  coverage:
    name: coverage gate(core ≥ 90%,ast ≥ 75% 豁免)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain + llvm tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Collect coverage
        run: cargo llvm-cov --lcov --output-path target/coverage.lcov

      - name: Coverage gate
        run: python3 tools/cov_gate.py target/coverage.lcov


  # P4-0(PIVOT-RUSTC-ORACLE §四):Tier-A oracle 門檻 —— stable rustc 即可,
  # 零 rustc_private/nightly 依賴;門檻 = 外律 O 系 + 語料對帳(BUG 候選 0
  # + 兩趟全等 + 基線判決不漂移)+ P4-1 parity(分歧 = 註冊表,lexical 下界定律)。
  oracle:
    name: oracle gate(P4-0/P4-1:rustc 判決對帳 + 三軌 parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: clippy with oracle feature (deny warnings)
        run: cargo clippy --all-targets --features oracle -- -D warnings

      - name: 全測試矩陣(32 單測 + 32 內律 + 外律 O 系 9 條,含 P4-3 O-8/O-9)
        run: cargo test --all --features oracle

      - name: P4-2 生成式差分併軌(2000 輪 by-construction × rustc × 三軌;P4-3 後 over/under 必 0/0)
        run: cargo run --features oracle --release --bin fuzz

      - name: rustdoc with oracle feature (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features oracle

      - name: oracle gate(41 語料 × 兩趟全等 × 基線對帳 × parity 註冊表 4 項)
        run: python3 tools/oracle_gate.py corpus/curated corpus/BASELINE.json --parity
